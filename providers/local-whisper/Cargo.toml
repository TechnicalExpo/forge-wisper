[package]
name = "forge-provider-local-whisper"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
forge-transcription = { path = "../../crates/transcription" }
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
directories = { workspace = true }
hound = { workspace = true }
whisper-rs = { version = "0.16.0", default-features = false, features = ["tracing_backend"] }
transcribe-rs = { version = "0.2.9", default-features = false, features = ["parakeet"] }
flate2 = "1.0"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
whisper-rs = { version = "0.16.0", features = ["vulkan"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
